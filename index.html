<!DOCTYPE html>
<html>

<head>
    <title>Employee Management Dashboard</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

<div class="dashboard">
    <h1>Employee Management Dashboard</h1>

    <div class="form-group">
        <label for="name">Employee Name:</label>
        <input type="text" id="name" placeholder="Enter name" maxlength="50" required>
        <small>Enter Maximum 2-50 characters. Only letters and spaces allowed.</small>
    </div>

    <div class="form-group">
        <label for="salary">Employee Salary:</label>
        <input type="number" id="salary" placeholder="Enter salary" maxlength="100000000000" required>
        <small>Enter a valid salary amount.</small>
    </div>

    <div class="form-group">
        <label for="department">Department:</label>
        <input type="text" id="department" placeholder="Enter department" maxlength="50" required>
        <small>Example: IT, HR, Finance, Marketing.</small>
    </div>

    <div class="button-group">
        <button id="addEmployeeBtn">Add Employee</button>
        <button id="viewEmployeesBtn">View Employees</button>
    </div>



</div>

<script src="script.js"></script>

</body>

</html>
